<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>That's not my neighbor</title>
    <link rel="stylesheet" href="./style.css">
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="./thats-not-my-neighbor.icon.png" />
    <link rel="apple-touch-icon" href="./thats-not-my-neighbor.apple-touch-icon.png" />
</head>

<body>
    <script src="./main.js"></script>
    <div id="loading-text" style="color: white; font-family: cursive; font-size: 48px; text-align: center; margin-top: 20px;">LOADING...</div>
    <canvas id="canvas"> Your browser does not support the canvas tag. </canvas>
    <noscript> Your browser does not support JavaScript. </noscript>
    
    <div id="status">
        <img id="status-splash" class="show-image--true fullsize--false use-filter--true" src="./thats-not-my-neighbor.png" alt="">
        <progress id="status-progress"></progress>
        <div id="status-notice" class="godot" style="display: none;"></div>
    </div>

    <script src="./thats-not-my-neighbor.js"></script>
    <script>
        const GODOT_CONFIG = {
            "args": [],
            "canvasResizePolicy": 2,
            "executable": "thats-not-my-neighbor",
            "experimentalVK": false,
            "fileSizes": {
                "thats-not-my-neighbor.pck": 546220320,
                "thats-not-my-neighbor.wasm": 34324328
            },
            "focusCanvas": true,
            "gdnativeLibs": []
        };

        const engine = new Engine(GODOT_CONFIG);

        (function () {
            const statusProgress = document.getElementById('status-progress');
            const statusNotice = document.getElementById('status-notice');
            const statusContainer = document.getElementById('status');
            const loadingText = document.getElementById('loading-text');
            
            // Changed from const to let so it can be reassigned
            let currentStatusMode = ''; 

            function setStatusMode(mode) {
                if (currentStatusMode === mode || !statusProgress) {
                    return;
                }
                
                // Ensure elements are visible/hidden correctly
                [statusProgress, statusNotice].forEach((elem) => {
                    elem.style.display = 'none';
                });

                switch (mode) {
                    case 'progress':
                        statusProgress.style.display = 'block';
                        statusContainer.style.visibility = 'visible';
                        break;
                    case 'notice':
                        statusNotice.style.display = 'block';
                        statusContainer.style.visibility = 'visible';
                        break;
                    case 'hidden':
                        statusContainer.style.display = 'none';
                        if (loadingText) loadingText.style.display = 'none';
                        break;
                    default:
                        throw new Error('Invalid status mode');
                }
                currentStatusMode = mode;
            }

            function displayFailureNotice(err) {
                const msg = err.message || err;
                console.error(msg);
                statusNotice.innerText = msg;
                setStatusMode('notice');
            }

            const missing = Engine.getMissingFeatures();
            if (missing.length !== 0) {
                const serviceWorker = ('serviceWorker' in navigator);
                let msg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
                if (!serviceWorker) {
                    msg += 'Service Worker Support\n';
                }
                displayFailureNotice(msg + missing.join('\n'));
            } else {
                setStatusMode('progress');
                engine.startGame({
                    'onProgress': function (current, total) {
                        if (current > 0 && total > 0) {
                            statusProgress.value = current;
                            statusProgress.max = total;
                        } else {
                            statusProgress.removeAttribute('value');
                            statusProgress.removeAttribute('max');
                        }
                    },
                }).then(() => {
                    setStatusMode('hidden');
                }, displayFailureNotice);
            }
        }());
    </script>
</body>

</html>
