<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>That's Not My Neighbor</title>
    <script src="coi-serviceworker.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="thats-not-my-neighbor.icon.png" />
    <style>
        body { background-color: #161616; color: white; margin: 0; overflow: hidden; }
        #loading-container {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; font-family: sans-serif;
        }
        progress { width: 300px; }
    </style>
</head>
<body>
    <div id="loading-container">
        <div id="loading-text" style="font-size: 24px; margin-bottom: 10px;">Merging Game Files...</div>
        <progress id="merge-progress" value="0" max="100"></progress>
    </div>

    <canvas id="canvas">Your browser does not support canvas.</canvas>

    <script src="thats-not-my-neighbor.js"></script>
    <script>
        const statusProgress = document.getElementById('merge-progress');
        const loadingText = document.getElementById('loading-text');

        async function mergeParts(baseName, count) {
            let buffers = [];
            for (let i = 1; i <= count; i++) {
                loadingText.innerText = `Fetching ${baseName} part ${i}/${count}...`;
                const response = await fetch(`${baseName}.part${i}`);
                if (!response.ok) throw new Error(`Failed to fetch ${baseName}.part${i}`);
                const data = await response.arrayBuffer();
                buffers.push(data);
                
                // Update simple progress bar
                statusProgress.value = (i / count) * 100;
            }
            return new Blob(buffers, { type: 'application/octet-stream' });
        }

        async function startGame() {
            try {
                // 1. Merge PCK parts (1-20)
                const pckBlob = await mergeParts('thats-not-my-neighbor.pck', 20);
                const pckUrl = URL.createObjectURL(pckBlob);

                // 2. Merge WASM parts (1-3)
                const wasmBlob = await mergeParts('thats-not-my-neighbor.wasm', 3);
                const wasmUrl = URL.createObjectURL(wasmBlob);

                // 3. Initialize Godot Engine
                const engine = new Godot();
                
                loadingText.innerText = "Starting Engine...";
                
                engine.startGame({
                    'args': ['--main-pack', pckUrl],
                    'canvasResizePolicy': 2,
                    'executable': wasmUrl, // Pointing to our merged WASM
                    'onProgress': function (current, total) {
                        if (total > 0) {
                            statusProgress.value = (current / total) * 100;
                        }
                    },
                }).then(() => {
                    document.getElementById('loading-container').style.display = 'none';
                });

            } catch (err) {
                loadingText.innerText = "Error: " + err.message;
                console.error(err);
            }
        }

        // Start the process
        startGame();
    </script>
</body>
</html>
