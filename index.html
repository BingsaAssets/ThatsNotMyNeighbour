<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>That's Not My Neighbor</title>
    <script src="coi-serviceworker.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="thats-not-my-neighbor.icon.png" />
    <style>
        body { background-color: #161616; color: white; margin: 0; overflow: hidden; }
        #status {
            position: absolute; left: 0; top: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; background-color: #161616; z-index: 10;
        }
        #status-splash { max-width: 80%; max-height: 50%; margin-bottom: 20px; }
        progress { width: 300px; height: 20px; }
        #status-notice { color: #ff5555; font-family: sans-serif; margin-top: 10px; visibility: hidden; }
    </style>
</head>
<body>
    <div id="status">
        <img id="status-splash" src="thats-not-my-neighbor.png" alt="Logo">
        <div id="loading-text" style="font-family: cursive; font-size: 24px; margin-bottom: 10px;">Loading Game Parts...</div>
        <progress id="status-progress" value="0" max="100"></progress>
        <div id="status-notice"></div>
    </div>

    <canvas id="canvas">Your browser does not support canvas.</canvas>

    <script src="thats-not-my-neighbor.js"></script>
    <script>
        const statusProgress = document.getElementById('status-progress');
        const loadingText = document.getElementById('loading-text');
        const statusNotice = document.getElementById('status-notice');

        async function mergeParts(baseName, count) {
            let buffers = [];
            for (let i = 1; i <= count; i++) {
                loadingText.innerText = `Fetching ${baseName} (${i}/${count})...`;
                const response = await fetch(`${baseName}.part${i}`);
                if (!response.ok) throw new Error(`Missing ${baseName}.part${i}`);
                const data = await response.arrayBuffer();
                buffers.push(data);
                statusProgress.value = (i / count) * 100;
            }
            return new Blob(buffers, { type: 'application/octet-stream' });
        }

        async function initGame() {
            try {
                // 1. Merge the split files
                const pckBlob = await mergeParts('thats-not-my-neighbor.pck', 20);
                const wasmBlob = await mergeParts('thats-not-my-neighbor.wasm', 3);
                
                const pckUrl = URL.createObjectURL(pckBlob);
                const wasmUrl = URL.createObjectURL(wasmBlob);

                // 2. Initialize the Godot engine instance
                // In your JS, Godot is a function that returns the Engine class
                const engine = new Godot();

                loadingText.innerText = "Starting Engine...";

                // 3. Start the game using the merged blobs
                engine.startGame({
                    'executable': wasmUrl,
                    'mainPack': pckUrl,
                    'canvasResizePolicy': 2,
                    'onProgress': function (current, total) {
                        if (total > 0) {
                            statusProgress.value = (current / total) * 100;
                        }
                    },
                }).then(() => {
                    document.getElementById('status').style.display = 'none';
                });

            } catch (err) {
                statusNotice.innerText = "Error: " + err.message;
                statusNotice.style.visibility = 'visible';
                loadingText.innerText = "Load Failed";
                console.error(err);
            }
        }

        initGame();
    </script>
</body>
</html>
